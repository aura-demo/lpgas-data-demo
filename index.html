    return true;
  }catch(e){
    if(!silent)document.getElementById('err').textContent='パスワードが違います';
    return false;
  }
}
function go(){tryOpen(document.getElementById('pw').value,false)}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
(async()=>{const s=localStorage.getItem(LS_KEY);if(s)await tryOpen(s,true)})();
</script></body></html>
